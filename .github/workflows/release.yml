name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: 还原签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PROPERTIES" ]; then
            echo "::error::缺少签名 Secrets：请先在仓库 Settings → Secrets and variables → Actions 配置 KEYSTORE_BASE64（valo-release.jks 的 Base64）与 KEYSTORE_PROPERTIES（keystore.properties 原文）"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > valo-release.jks
          printf '%s' "$KEYSTORE_PROPERTIES" > keystore.properties

      - name: 构建 release APK（版本号取自 tag）
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PvaloVersionName="${GITHUB_REF_NAME#v}"

      - name: 以 tag 命名产物
        run: cp app/build/outputs/apk/release/app-release.apk "valo-${GITHUB_REF_NAME}.apk"

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: valo-${{ github.ref_name }}.apk
          generate_release_notes: true
