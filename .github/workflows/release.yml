name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # 先建 Release（带自动变更说明），Android / iOS 两个构建 job 再并行附加产物，
  # 避免两边并发创建同一 Release 的竞争
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - name: 创建 Release（已存在则跳过）
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release 已存在，跳过创建"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi

  android:
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: 还原签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PROPERTIES" ]; then
            echo "::error::缺少签名 Secrets：请先在仓库 Settings → Secrets and variables → Actions 配置 KEYSTORE_BASE64（valo-release.jks 的 Base64）与 KEYSTORE_PROPERTIES（keystore.properties 原文）"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > valo-release.jks
          printf '%s' "$KEYSTORE_PROPERTIES" > keystore.properties

      - name: 构建 release APK（版本号取自 tag）
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease -PvaloVersionName="${GITHUB_REF_NAME#v}"

      - name: 以 tag 命名产物
        run: cp androidApp/build/outputs/apk/release/androidApp-release.apk "valo-${GITHUB_REF_NAME}.apk"

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: valo-${{ github.ref_name }}.apk

  # 未签名 IPA：工程无共享 scheme，用 -target 构建；
  # -derivedDataPath 与 -target 不兼容，改传 SYMROOT 指定产物目录。
  # 模拟器包不随发版构建，需要时手动触发 ios.yml 单独出
  ios:
    needs: create-release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: 构建 iOS App（未签名）
        run: |
          chmod +x gradlew
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build/ios-products" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            build

      # IPA：Payload/<App>.app 结构，供真机自签
      - name: 打包产物
        run: |
          APP_PATH=$(find build/ios-products -type d -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到 .app 构建产物"
            exit 1
          fi
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qr "valo-${GITHUB_REF_NAME}-ios-unsigned.ipa" Payload

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: valo-${{ github.ref_name }}-ios-unsigned.ipa
