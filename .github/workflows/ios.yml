# iOS 模拟器包的手动触发构建（Appetize 等云模拟器用），不连带动其他构建。
# 发版（tag 推送）走 release.yml，出 Android APK + iOS 未签名 IPA；
# 发版 IPA 缺失或失败时重跑 Release 工作流里失败的 ios job 即可。
name: iOS Simulator Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要附加产物的 Release tag（如 v1.0.7，留空只传 Artifact）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # 只构建 arm64：工程未注册 iosX64，Compose 的资源同步任务遇到 x86_64 会
      # 报 "Unknown iOS simulator arch"；Appetize 官方也推荐 ARM 模拟器构建。
      # 工程无共享 scheme，用 -target 构建；-derivedDataPath 与 -target 不兼容，
      # 改传 SYMROOT 指定产物目录；关闭签名，由云模拟器直接运行
      - name: 构建 iOS 模拟器版（未签名）
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Release \
            -sdk iphonesimulator \
            ARCHS=arm64 \
            SYMROOT="$PWD/build/ios-sim" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            build

      # 模拟器包：.app 置于 zip 根目录（Appetize 要求，macOS 打包保留执行权限位）
      - name: 打包产物
        run: |
          SIM_APP=$(find build/ios-sim -type d -name "*.app" | head -n 1)
          if [ -z "$SIM_APP" ]; then
            echo "::error::未找到模拟器 .app 构建产物"
            exit 1
          fi
          RELEASE_TAG="${{ github.event.inputs.tag }}"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi
          cd "$(dirname "$SIM_APP")"
          zip -qr "$GITHUB_WORKSPACE/valo-${RELEASE_TAG}-ios-simulator.zip" "$(basename "$SIM_APP")"
          echo "SIM_ZIP=valo-${RELEASE_TAG}-ios-simulator.zip" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      # 手动触发的 Artifact 会再包一层 zip，解压后即是可用的模拟器包
      - name: 上传构建产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: valo-ios-simulator
          path: ${{ env.SIM_ZIP }}

      - name: 附加到 GitHub Release
        if: github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.SIM_ZIP }}
